<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ClaimTrackr - AI claim verification{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <div class="container">
      <a class="brand" href="/">
        <span class="logo">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 4.5-3.2 8.2-8 9-4.8-.8-8-4.5-8-9V6l8-3z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></svg>
        </span>
        ClaimTrackr <small>AI claim verification</small>
      </a>
      <nav class="nav">
        <a href="/" class="{{ 'active' if request.path == '/' }}">New claim</a>
        <a href="/history" class="{{ 'active' if request.path.startswith(('/history', '/claims')) }}">History</a>
      </nav>
    </div>
  </header>
  {% block body %}{% endblock %}
  <footer class="footer container">ClaimTrackr &middot; RAG + FAISS + LLM &middot; demo project using fictional data</footer>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
